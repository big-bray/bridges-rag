[project]
name = "bridges-rag"
version = "0.1.0"
description = "Local semantic search over the Bridges Mathematical Art Archive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pymupdf4llm>=0.0.17",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bridges_rag"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pymupdf4llm.*", "pymupdf.*", "qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "test_listing",
    "test_detail",
    "test_manifest",
    "test_download",
    "test_bibtex",
    "test_extract_pdf",
    "test_extract_pipeline",
    "test_chunker",
    "test_qdrant",
    "test_embedder",
    "test_citation",
    "test_search",
    "test_eval_metrics",
    "test_eval_benchmark",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
