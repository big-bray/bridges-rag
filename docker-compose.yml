services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333" # HTTP API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - ./data/qdrant:/qdrant/storage

  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474" # HTTP API + browser (http://localhost:7474)
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/bridgesrag
    volumes:
      - ./data/neo4j:/data
